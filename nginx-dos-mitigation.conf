# ============================================
# DoS Mitigation Config — Slowloris Protection
# Thêm phần này vào trong khối http {} của
# /etc/nginx/nginx.conf
# ============================================

http {
    # ... các cấu hình mặc định khác của nginx giữ nguyên ...

    # Vùng nhớ lưu số kết nối theo từng IP (10MB đủ cho ~160,000 IP)
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # Nếu client không gửi xong phần header trong 5 giây -> nginx đóng kết nối
    client_header_timeout 5s;

    # Nếu client không gửi xong phần body trong 5 giây -> nginx đóng kết nối
    # (Đây là điểm mấu chốt chống Slowloris, vì Slowloris cố tình gửi
    # request rất chậm, không bao giờ hoàn thành)
    client_body_timeout   5s;

    # Timeout khi server gửi response cho client
    send_timeout          5s;

    # Thời gian giữ kết nối keep-alive ngắn lại
    keepalive_timeout     5;
}

# ============================================
# Thêm dòng này vào trong khối server {} của
# /etc/nginx/sites-available/default
# ============================================

server {
    # ... các cấu hình mặc định khác giữ nguyên ...

    # Giới hạn mỗi IP chỉ được tối đa 10 kết nối đồng thời
    # -> 1 nguồn (1 máy tấn công) không thể chiếm hết connection pool
    limit_conn addr 10;
}
